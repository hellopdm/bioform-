        <button data-tab="inverse_design" class="nav-tab-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-navy-900 border border-transparent transition-all text-left">

          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

  <!-- 3. 새 프로젝트 생성 모달 (Modal)                                          -->
  <!-- ========================================================================= -->
  <div id="modal-new-project" class="hidden fixed inset-0 z-50 bg-navy-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-navy-900 border border-navy-800 rounded-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl relative">
      <div class="flex justify-between items-center border-b border-navy-800 pb-4 mb-4">
        <div>
          <h3 class="text-lg font-black text-white">새 생체재료 연구 프로젝트 생성</h3>
          <p class="text-xs text-slate-400 mt-0.5">연구 목적과 대상 약물, 주요 후보 재료를 등록합니다.</p>
        </div>
        <button id="btn-close-create-modal" class="text-slate-400 hover:text-white text-xl font-bold p-1">&times;</button>
      </div>

      <form id="form-create-project" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-300 mb-1">프로젝트명 <span class="text-sky-400">*</span></label>
          <input type="text" name="projectName" required placeholder="예: pH 감응형 대장 표적 서방 하이드로겔 개발"
                 class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-800 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1">연구 목적 <span class="text-sky-400">*</span></label>
          <input type="text" name="projectPurpose" required placeholder="예: 위산 누출 방지 및 장관 내 90% 이상 표적 약물 방출"
                 class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-800 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1">대상 약물 (Target Drug)</label>
          <input type="text" name="targetDrug" placeholder="예: 인슐린, 독소루비신, 소염 펩타이드"
                 class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-800 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-2">사용 후보 생체재료 선택 (복수 선택)</label>

            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" name="materials" value="alginate" checked class="accent-sky-500">
              <span>알지네이트</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" name="materials" value="chitosan" checked class="accent-sky-500">
              <span>키토산</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" name="materials" value="paa" checked class="accent-sky-500">
              <span>폴리아크릴산(PAA)</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" name="materials" value="gelatin" class="accent-sky-500">
              <span>젤라틴</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" name="materials" value="collagen" class="accent-sky-500">
              <span>콜라겐</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" name="materials" value="peg" class="accent-sky-500">
              <span>PEG</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" name="materials" value="plga" class="accent-sky-500">
              <span>PLGA</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" name="materials" value="pcl" class="accent-sky-500">
              <span>PCL</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" name="materials" value="hydroxyapatite" class="accent-sky-500">
              <span>하이드록시아파타이트</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1">연구 설명 및 가설</label>
          <textarea name="projectDescription" rows="2.5" placeholder="프로젝트에 대한 추가 배경 설명이나 가교 전략을 입력하세요."

  <div id="ui-toast" class="fixed bottom-6 right-6 px-4 py-3 rounded-xl bg-navy-900 border border-sky-500/50 text-sky-400 text-xs font-bold shadow-2xl transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-none z-50 flex items-center gap-2">

  /**

  analyzeMaterialInteraction(matAId, matBId, conditions = { ph: 7.4, temp: 37.0, ionicStrength: 0.15 }) {
    const matA = BIOMATERIALS_DB.find(m => m.id === matAId);

    const isCationicA = matA.chargeType === "cationic";
    const isAnionicB = matB.chargeType === "anionic";
    const isCationicB = matB.chargeType === "cationic";

      const chargeA = isAnionicA ? (ph > matA.pKa ? 1.0 : 0.2) : (ph < matA.pKa ? 1.0 : 0.2);

        strength: intensity > 60 ? "매우 강력 (Strong Attraction)" : "중등도 (Moderate)",
        score: Math.round(intensity),
        mechanism: `${matA.nameKo}의 음이온 작용기와 ${matB.nameKo}의 양이온 작용기 간 쿨롱 인력으로 폴리이온 복합체(Polyelectrolyte Complex, PEC)를 자가조립 형성합니다.`,

                              (matB.functionalGroups.some(g => g.includes("-OH") || g.includes("-NH")));

    const isHydrophobicA = matA.hydrophilicityScore < 4.0;
    const isHydrophobicB = matB.hydrophilicityScore < 4.0;
    const isPnipamA = matA.id === "pnipam" && temp >= 32;
    const isPnipamB = matB.id === "pnipam" && temp >= 32;

    if (isHydrophobicA || isHydrophobicB || isPnipamA || isPnipamB) {
      interactions.push({
        type: "소수성 상호작용 (Hydrophobic Association)",
        strength: (isHydrophobicA && isHydrophobicB) ? "강력한 소수성 회합" : "계면 마이크로 도메인 형성",
        score: (isHydrophobicA && isHydrophobicB) ? 88 : 65,
        mechanism: "소수성 세그먼트(예: PCL/PLGA의 탄화수소 사슬 또는 PNIPAM 이소프로필기)가 수계 환경에서 물 분자 엔트로피 증가를 위해 자가 결집(Aggregation)합니다.",
        conditionEffect: `온도 ${temp}℃: 온도가 체온(37℃)으로 상승할수록 소수성 상호작용의 엔트로피 구동력이 강화되어 코어-쉘 또는 미셀 구조 형성이 가속화됩니다.`
      });

    if (matA.id === "hydroxyapatite" || matB.id === "hydroxyapatite") {

      interactions.push({
        type: "무기-유기 이온 배위 결합 (Bioceramic Coordination)",

        conditionEffect: "중성 pH(7.4)에서 HAp의 용출이 억제되며 안정적인 계면 결합을 형성합니다."

    return {
      materialA: matA,
      materialB: matB,
      compatibilityScore: Math.min(98, compatibilityScore),
      interactions,
      summaryText: `${matA.nameKo}와(과) ${matB.nameKo}의 조합은 ${interactions.map(i => i.type.split(' ')[0]).join(', ')} 등의 복합 상호작용을 통해 ${compatibilityScore >= 80 ? '매우 우수한 상용성과 구조 안정성' : '적절한 상호 보완성'}을 나타냅니다.`

  /**
   * 2. 복합재료 종합 물성 예측 (Property Simulation)
   * 탄성계수(E), 인장강도(UTS), 팽윤율(Q), 생분해 속도, 생체적합성 지표
   */
  calculateCompositeProperties(composition, crosslinkerId, crosslinkerDensity, conditions = {}) {
    const ph = conditions.ph !== undefined ? conditions.ph : 7.4;
    const temp = conditions.temp !== undefined ? conditions.temp : 37.0;

    // 가중 평균 기본 계산
    let weightedStiffness = 0;
    let weightedTensile = 0;
    let weightedSwelling = 0;
    let weightedBiodegDays = 0;
    let weightedBiocompatibility = 0;
    let weightedHydrophilicity = 0;
    let anionicRatio = 0;
    let cationicRatio = 0;

    composition.forEach(comp => {
      const mat = BIOMATERIALS_DB.find(m => m.id === comp.id);
      if (!mat) return;
      const w = comp.ratio / 100;

      weightedStiffness += w * (parseFloat(mat.elasticModulus.split('-')[0]) || 20);
      weightedTensile += w * (parseFloat(mat.tensileStrength.split('-')[0]) || 2.0);
      weightedSwelling += w * mat.swellingMaxPercent;
      weightedBiodegDays += w * mat.biodegradabilityDays;
      weightedBiocompatibility += w * mat.biocompatibilityScore;
      weightedHydrophilicity += w * mat.hydrophilicityScore;

      if (mat.chargeType === "anionic") anionicRatio += comp.ratio;
      if (mat.chargeType === "cationic") cationicRatio += comp.ratio;
    });

    // 폴리이온 복합체(PEC) 염교 보강 계수
    const pecRatio = Math.min(anionicRatio, cationicRatio);
    const pecEnhancement = 1.0 + (pecRatio / 100) * 0.8;

    // 가교제 밀도 기여분 (crosslinkerDensity: 0.5 ~ 5.0 wt%)
    const crosslinkFactor = 1.0 + (crosslinkerDensity * 0.28);

    // pH 팽윤 효과
    let phSwellingFactor = 1.0;
    if (ph < 3.0) {
      phSwellingFactor = 0.35 + (cationicRatio / 100) * 0.3; // 산성 수축
    } else if (ph > 6.0) {
      phSwellingFactor = 0.85 + (anionicRatio / 100) * 0.8; // 카복실기 이온화 팽윤
    }

    // 최종 물성 산출
    const elasticModulusKPa = parseFloat((weightedStiffness * pecEnhancement * crosslinkFactor).toFixed(1));
    const tensileStrengthMPa = parseFloat((weightedTensile * (0.8 + (crosslinkerDensity * 0.22)) * pecEnhancement).toFixed(2));
    const swellingRatioPercent = Math.round((weightedSwelling / crosslinkFactor) * phSwellingFactor * (weightedHydrophilicity / 9.0));
    const biodegradationDays = Math.round(weightedBiodegDays * (1 + crosslinkerDensity * 0.15));
    const biocompatibilityScore = Math.min(99, Math.round(weightedBiocompatibility - (crosslinkerId === "glutaraldehyde" ? 15 : 0)));

    return {
      elasticModulusKPa: Math.max(5.0, Math.min(120.0, elasticModulusKPa)),
      tensileStrengthMPa: Math.max(0.5, Math.min(50.0, tensileStrengthMPa)),
      swellingRatioPercent: Math.max(105, Math.min(2800, swellingRatioPercent)),
      biodegradationDays: Math.max(7, biodegradationDays),
      biodegradationRateText: `약 ${biodegradationDays}일 (주당 약 ${(100 / (biodegradationDays / 7)).toFixed(1)}% 감량)`,
      biocompatibilityScore,
      pecRatio
    };
  },

  /**
   * 3. 약물 방출 키네틱 시뮬레이션 (Drug Release Simulation)
   * 시간대별 방출량, 누적 방출률, 초기 방출 속도, 지속 시간(t80)
   */
  simulateDrugRelease(composition, crosslinkerId, crosslinkerDensity, options = {}) {
    const timePoints = [0, 0.5, 1, 2, 4, 6, 8, 12, 16, 20, 24]; // 시간(h)
    const ph = options.ph !== undefined ? options.ph : 7.4;
    const drugLoading = options.drugLoading !== undefined ? options.drugLoading : 5.0; // wt% (약물 함량)
    const totalDrugMg = drugLoading * 10; // 총 약물량 (mg 기준)

    const props = this.calculateCompositeProperties(composition, crosslinkerId, crosslinkerDensity, { ph });

    // Korsmeyer-Peppas 방출 지수 n
    const alg = (composition.find(c => c.id === "alginate")?.ratio || 0) / 100;
    const paa = (composition.find(c => c.id === "paa")?.ratio || 0) / 100;
    const chit = (composition.find(c => c.id === "chitosan")?.ratio || 0) / 100;

    let nExponent = 0.48 + (alg * 0.2) + (paa * 0.18) - (crosslinkerDensity * 0.03);
    nExponent = Math.max(0.45, Math.min(0.85, parseFloat(nExponent.toFixed(2))));

    const amountReleasedMg = [];

      let releasePct = 0;

      } else {

        const theoretical = rateConstant * Math.pow(t, nExponent) * 100;

        releasePct = 100 * (1 - Math.exp(-0.015 * theoretical));

      const val = parseFloat(releasePct.toFixed(1));

    const release24h = cumulativeRelease[cumulativeRelease.length - 1];

    let sustainedDurationHours = 24;

        sustainedDurationHours = timePoints[i];
        break;
      }

      sustainedDurationHours = Math.round(24 * (80 / Math.max(1, release24h)));
    }

      timePoints,
      cumulativeRelease,
      amountReleasedMg,
      initialBurstRate,
      release24h,
      sustainedDurationHours,
      nExponent,
      r2Score: 0.985,
      mechanismText: nExponent <= 0.45 ? "Fickian 확산 (Case I Diffusional Transport)" :
                     nExponent < 0.89 ? "비픽 확산 (Anomalous Transport: 확산 및 고분자 사슬 팽윤 복합)" :
                     "Case II 완화 지배형 방출 (Zero-Order Relaxation 근사)"
    };
  },

  /**
   * 4. 목표 물성 기반 AI 역설계 엔진 (Inverse Design)
   * 3~5개 복합재료 조성 후보 생성 및 목표값 대비 오차 비교
   */
  runInverseDesign(targets) {
    const {
      targetModulus = 30, // kPa
      targetSwelling = 1200, // %
      targetRelease = 85, // %
      targetBiodegradation = 28 // days
    } = targets;

    // 다양한 탐색 후보군 조합 템플릿
    const candidateArchetypes = [
      { name: "후보 A (다당류-단백질 고탄성계)", comp: [{ id: "alginate", ratio: 55 }, { id: "chitosan", ratio: 30 }, { id: "gelatin", ratio: 15 }], crosslinker: "ca", density: 2.2 },
      { name: "후보 B (pH 반응형 서방 장용성계)", comp: [{ id: "alginate", ratio: 60 }, { id: "chitosan", ratio: 25 }, { id: "paa", ratio: 15 }], crosslinker: "ca", density: 2.0 },
      { name: "후보 C (ECM 모방 생체친화 스캐폴드)", comp: [{ id: "collagen", ratio: 50 }, { id: "hyaluronic_acid", ratio: 30 }, { id: "peg", ratio: 20 }], crosslinker: "edc_nhs", density: 1.8 },
      { name: "후보 D (고강도 무기-유기 복합 지지체)", comp: [{ id: "alginate", ratio: 45 }, { id: "hydroxyapatite", ratio: 35 }, { id: "chitosan", ratio: 20 }], crosslinker: "ca", density: 2.5 },
      { name: "후보 E (장기 서방형 침식-확산계)", comp: [{ id: "chitosan", ratio: 40 }, { id: "plga", ratio: 35 }, { id: "peg", ratio: 25 }], crosslinker: "genipin", density: 1.5 }
    ];

    const results = candidateArchetypes.map((archetype, idx) => {
      const props = this.calculateCompositeProperties(archetype.comp, archetype.crosslinker, archetype.density);
      const sim = this.simulateDrugRelease(archetype.comp, archetype.crosslinker, archetype.density);

      // 목표값과 예측값의 차이(Delta)
      const diffModulus = parseFloat((props.elasticModulusKPa - targetModulus).toFixed(1));
      const diffSwelling = Math.round(props.swellingRatioPercent - targetSwelling);
      const diffRelease = parseFloat((sim.release24h - targetRelease).toFixed(1));
      const diffBiodeg = Math.round(props.biodegradationDays - targetBiodegradation);

      // 가중 상대 오차
      const errMod = Math.abs(diffModulus) / targetModulus;
      const errSw = Math.abs(diffSwelling) / targetSwelling;
      const errRel = Math.abs(diffRelease) / targetRelease;
      const errBio = Math.abs(diffBiodeg) / targetBiodegradation;

      const totalLoss = (errMod * 0.3) + (errSw * 0.25) + (errRel * 0.3) + (errBio * 0.15);
      const matchScore = Math.max(55, Math.min(99.2, parseFloat((100 - totalLoss * 60).toFixed(1))));

      return {
        id: `cand_${idx + 1}`,
        name: archetype.name,
        composition: archetype.comp,
        crosslinker: archetype.crosslinker,
        crosslinkerDensity: archetype.density,
        predictedProps: props,
        predictedRelease: sim.release24h,
        sustainedHours: sim.sustainedDurationHours,
        differences: {
          modulus: diffModulus,
          swelling: diffSwelling,
          release: diffRelease,
          biodegradation: diffBiodeg
        },
        matchScore
      };
    });

    // 매칭 스코어 기준 내림차순 정렬
    results.sort((a, b) => b.matchScore - a.matchScore);
    return results; // 5개 후보 전체 반환
  },

  /**
   * 5. 다목적 최적화 및 순위 산출 (Multi-Objective Optimization)
   * 5대 가중치(약물방출 지속, 생체적합성, 강도, 분해시간, 비용)
   */
  runMultiObjectiveOptimization(arg1, arg2) {
    let customCandidates = null;
    let weights = { duration: 25, biocompatibility: 25, strength: 20, biodegradation: 15, cost: 15 };

    if (Array.isArray(arg1)) {
      customCandidates = arg1;
      if (arg2 && typeof arg2 === "object") {
        weights = { ...weights, ...arg2 };
      }
    } else if (arg1 && typeof arg1 === "object") {
      weights = { ...weights, ...arg1 };
    }

    const duration = Number(weights.duration) || 0;
    const biocompatibility = Number(weights.biocompatibility) || 0;
    const strength = Number(weights.strength ?? weights.modulus) || 0;
    const biodegradation = Number(weights.biodegradation) || 0;
    const cost = Number(weights.cost) || 0;

    const totalW = (duration + biocompatibility + strength + biodegradation + cost) || 100;
    const wDur = duration / totalW;
    const wBio = biocompatibility / totalW;
    const wStr = strength / totalW;
    const wDeg = biodegradation / totalW;
    const wCost = cost / totalW;

    // 후보군 (전달받은 후보가 있으면 사용, 없으면 역설계 생성)
    const candidates = (customCandidates && customCandidates.length > 0)
      ? customCandidates
      : this.runInverseDesign({ targetModulus: 32, targetSwelling: 1100, targetRelease: 88, targetBiodegradation: 30 });

    const scoredCandidates = candidates.map(c => {
      // 0~100 정규화 서브 스코어
      const sDur = Math.min(100, (c.sustainedHours / 36) * 100);
      const sBio = c.predictedProps.biocompatibilityScore;
      const sStr = Math.min(100, (c.predictedProps.elasticModulusKPa / 60) * 100);
      const sDeg = Math.min(100, (c.predictedProps.biodegradationDays / 45) * 100);
      
      // 비용 지수 (PLGA, Collagen은 고가, Alginate/Chitosan은 저가)
      let costScore = 85;
      c.composition.forEach(comp => {
        if (comp.id === "collagen" || comp.id === "plga") costScore -= (comp.ratio / 100) * 35;
        if (comp.id === "alginate" || comp.id === "cellulose") costScore += (comp.ratio / 100) * 10;
      });
      const sCost = Math.max(40, Math.min(98, costScore));

      const overallScore = parseFloat((sDur * wDur + sBio * wBio + sStr * wStr + sDeg * wDeg + sCost * wCost).toFixed(1));

      return {
        ...c,
        subScores: {
          duration: Math.round(sDur),
          biocompatibility: Math.round(sBio),
          strength: Math.round(sStr),
          biodegradation: Math.round(sDeg),
          cost: Math.round(sCost)
        },
        overallScore
      };
    });

    scoredCandidates.sort((a, b) => b.overallScore - a.overallScore);
    return scoredCandidates;
  },

  /**
   * 6. Explainable AI (XAI) 요인 분석 및 중요도 그래프 데이터
   */
  explainDesign(composition, crosslinkerId, crosslinkerDensity, conditions = {}) {
    const importances = [];
    const ph = conditions.ph || 7.4;

    const alg = composition.find(c => c.id === "alginate")?.ratio || 0;
    const chit = composition.find(c => c.id === "chitosan")?.ratio || 0;
    const paa = composition.find(c => c.id === "paa")?.ratio || 0;
    const hap = composition.find(c => c.id === "hydroxyapatite")?.ratio || 0;

    if (alg > 0) {
      importances.push({
        variable: "알지네이트 조성비 (wt%)",
        importance: parseFloat(((alg / 100) * 0.38).toFixed(3)),
        impact: "+ 팽윤능 및 장용성 보호막 형성",
        mechanism: "Guluronate 블록이 Ca2+와 결합하여 산성 위액 침투를 억제하고, 중성 장액에서 카복실기(-COO-) 전하 반발로 팽윤을 유발합니다."
      });
    }

    if (chit > 0) {
      importances.push({
        variable: "키토산 조성비 (wt%)",
        importance: parseFloat(((chit / 100) * 0.31).toFixed(3)),
        impact: "+ 기계적 결합 및 점막 부착성",
        mechanism: "1차 아민기(-NH3+)가 알지네이트 카복실기와 강력한 정전기적 염교(PEC)를 형성하여 하이드로겔 망상의 파열을 방지합니다."
      });
    }

    if (paa > 0) {
      importances.push({
        variable: "PAA 함량 (wt%)",
        importance: parseFloat(((paa / 100) * 0.28).toFixed(3)),
        impact: "+ pH 4.5 이상 급격한 스위칭 방출",
        mechanism: "pKa 4.5 경계에서 가파른 이온화 상전이를 유발하여 십이지장 통과 후 약물 확산 경로를 급속 개방합니다."
      });
    }

    if (hap > 0) {
      importances.push({
        variable: "하이드록시아파타이트 함량 (wt%)",
        importance: parseFloat(((hap / 100) * 0.35).toFixed(3)),
        impact: "+ 압축 강도 및 골유착 촉진",
        mechanism: "무기질 나노결정이 고분자 망상 내 응력 집중을 완화하고 골전도성 미네랄을 서방 공급합니다."
      });
    }

    // 가교 밀도
    importances.push({
      variable: "가교 밀도 (Crosslinker wt%)",
      importance: parseFloat((crosslinkerDensity * 0.08).toFixed(3)),
      impact: "- 초기 약물 누출 억제 및 탄성률 증가",
      mechanism: "하이드로겔 평균 메쉬 크기(Mesh size, ξ)를 수축시켜 고분자 매트릭스로부터의 비특이적 버스트 방출을 통제합니다."
    });

    // 중요도 기준 내림차순 정렬
    importances.sort((a, b) => b.importance - a.importance);

    return {
      topCandidateName: "최적 배합 후보 (추천 1순위)",
      recommendationReason: "알지네이트의 음이온 전하 반발 팽윤과 키토산과의 정전기적 결합(PEC)이 이상적인 균형을 이루어, 위산 누출은 10% 미만으로 억제하면서 소장/대장에서 90% 이상 방출을 성공적으로 달성함.",
      prosAndCons: {
        pros: ["위산 환경 안정성 극대화", "높은 생체적합성(FDA 식품/의약 안전 등급)", "우수한 팽윤 및 방출 지속성"],
        cons: ["장기 보관 시 2가 양이온 해리 가능성", "동결 건조 시 재수화 편차 발생 가능"]
      },
      importances,
      disclaimer: "※ 본 변수 중요도 분석은 물리화학적 민감도(Sensitivity Analysis)에 기반한 교육용 시뮬레이션 지표이며, 실제 SHAP 머신러닝 모델 예측값과는 차이가 있을 수 있습니다."
    };
  },

  /**
   * 7. 활성 프로젝트 맞춤형 후속 실험 설계 생성기 (Dynamic Experimental Design Protocol)
   * 현재 프로젝트의 실제 재료, 배합비, 가교제에 근거하여 실험군 및 대조군 테이블 생성
   */
  generateDynamicExperimentProtocol(project) {
    const materials = project.materials || [{ id: "alginate", ratio: 60 }, { id: "chitosan", ratio: 40 }];
    const mainMat1 = BIOMATERIALS_DB.find(m => m.id === materials[0]?.id) || BIOMATERIALS_DB[0];
    const mainMat2 = BIOMATERIALS_DB.find(m => m.id === materials[1]?.id) || BIOMATERIALS_DB[1];
    const crosslinker = CROSSLINKERS.find(c => c.id === project.crosslinker) || CROSSLINKERS[0];
    const baseDensity = project.crosslinkerDensity || 2.0;

    // 실험군 1: 최적 추천군 (EXP-1)
    const exp1Comp = materials.map(m => {
      const db = BIOMATERIALS_DB.find(x => x.id === m.id);
      return `${db ? db.nameKo : m.id} ${m.ratio} wt%`;
    }).join(" + ");

    // 실험군 2: 가교 저밀도군 (EXP-2)
    const lowDensity = Math.max(0.5, parseFloat((baseDensity * 0.5).toFixed(1)));

    // 실험군 3: 주성분 비율 변경군 (EXP-3)
    const exp3Materials = JSON.parse(JSON.stringify(materials));
    if (exp3Materials.length >= 2) {
      exp3Materials[0].ratio = Math.max(10, exp3Materials[0].ratio - 15);
      exp3Materials[1].ratio = exp3Materials[1].ratio + 15;
    }
    const exp3Comp = exp3Materials.map(m => {
      const db = BIOMATERIALS_DB.find(x => x.id === m.id);
      return `${db ? db.nameKo : m.id} ${m.ratio} wt%`;
    }).join(" + ");

    const runs = [
      {
        id: "EXP-1",
        label: "최적 추천군 (Optimal)",
        compositionDesc: exp1Comp,
        crosslinkerDesc: `${crosslinker.name.split('(')[0]} ${baseDensity} wt%`,
        role: "시험군 (Test)",
        expectedOutcome: "목표 팽윤율 및 서방 방출 프로파일 완벽 충족"
      },
      {
        id: "EXP-2",
        label: "가교 저밀도 비교군",
        compositionDesc: exp1Comp,
        crosslinkerDesc: `${crosslinker.name.split('(')[0]} ${lowDensity} wt%`,
        role: "비교군 (Low-crosslink)",
        expectedOutcome: "초기 방출 속도 증가 및 탄성률 저하 경향 확인"
      },
      {
        id: "EXP-3",
        label: "조성비 변형 비교군",
        compositionDesc: exp3Comp,
        crosslinkerDesc: `${crosslinker.name.split('(')[0]} ${baseDensity} wt%`,
        role: "비교군 (Shifted-ratio)",
        expectedOutcome: `${mainMat2.nameKo} 함량 증가에 따른 전하 상호작용 변화 검증`
      },
      {
        id: "CTRL-NEG",
        label: "음성 대조군 (Negative Control)",
        compositionDesc: `${mainMat1.nameKo} 100 wt% 단독`,
        crosslinkerDesc: "가교제 무첨가 (0.0 wt%)",
        role: "음성 대조군",
        expectedOutcome: "급속 용해 또는 물리적 망상 붕해 발생"
      },
      {
        id: "CTRL-POS",
        label: "양성 대조군 (Positive Standard)",
        compositionDesc: "시판 표준 약물 전달 비히클 (Standard Enteric Matrix)",
        crosslinkerDesc: "공정 표준 기준",
        role: "양성 대조군",
        expectedOutcome: "산업 표준 서방형 용출 커브 벤치마킹"
      }
    ];

    return {
      topic: `${project.name}의 물성 및 방출 특성 실증 검증 연구`,
      hypothesis: `${mainMat1.nameKo}와(과) ${mainMat2.nameKo}의 최적 배합 조성 및 ${crosslinker.name.split('(')[0]} 가교를 통해 목표 물성과 서방 방출을 달성할 수 있다.`,
      runs,
      measurementProtocols: [
        {
          name: "1. FT-IR 분광분석기 (작용기 화학 결합)",
          detail: `${mainMat1.nameKo}와 ${mainMat2.nameKo} 간의 특이 피크 이동을 통해 분자간 상호작용 형성 확인.`
        },
        {
          name: "2. 회전형 레오미터 점탄성 측정 (Rheology)",
          detail: "진동 전단 주파수 스윕(Frequency sweep)을 통해 저장 탄성률 G'와 손실 탄성률 G''를 측정하고 겔화도 평가."
        },
        {
          name: "3. USP Dissolution Apparatus II (약물 용출 시험)",
          detail: `37℃ 수조에서 pH ${project.phCondition} 용출액을 적용하여 시간에 따른 누적 약물 농도를 분광광도계로 측정.`
        }
      ]
    };
  }
};

if (typeof window !== "undefined") {
  window.PhysicsEngine = PhysicsEngine;
}
  </script>

  <script>
  /* === ui.js === */
/**
 * BIOFORM AI - User Interface & Interactive Platform Controller
 * 10대 한국어 연구 모듈, 프로젝트 상태 관리(LocalStorage),
 * 모든 버튼/입력창의 실제 기능 연결 및 엔드투엔드 데이터 파이프라인
 */

const UI = {
  activeTab: "dashboard",
  projects: [],
  activeProjectId: null,
  
  // 차트 인스턴스 보관소
  charts: {},

  init() {
    this.initProjectState();
    this.bindNavigation();
    this.bindModalEvents();
    this.switchTab(this.activeTab);
  },

  // --------------------------------------------------------------------------
  // 1. 프로젝트 상태 관리 (LocalStorage 및 파이프라인 무결성 보장)
  // --------------------------------------------------------------------------
  initProjectState() {
    try {
      const saved = localStorage.getItem("bioform_projects");
      if (saved) {
        this.projects = JSON.parse(saved);
      }
    } catch (e) {
      console.warn("LocalStorage 접근 실패, 기본 데이터 사용");
    }

    if (!this.projects || this.projects.length === 0) {
      this.projects = JSON.parse(JSON.stringify(DEFAULT_PROJECTS));
      this.saveProjectsToStorage();
    }

    // 각 프로젝트에 누락된 파이프라인 필드 보강
    this.projects.forEach(p => this.ensureProjectPipelineData(p));

    const savedActiveId = localStorage.getItem("bioform_active_project_id");
    if (savedActiveId && this.projects.some(p => p.id === savedActiveId)) {
      this.activeProjectId = savedActiveId;
    } else {
      this.activeProjectId = this.projects[0].id;
    }
  },

  ensureProjectPipelineData(p) {
    if (!p.materials || p.materials.length === 0) {
      p.materials = [{ id: "alginate", ratio: 60 }, { id: "chitosan", ratio: 40 }];
    }
    if (!p.crosslinker) p.crosslinker = "ca";
    if (p.crosslinkerDensity === undefined) p.crosslinkerDensity = 2.0;
    if (p.phCondition === undefined) p.phCondition = 7.4;
    if (p.tempCondition === undefined) p.tempCondition = 37.0;
    if (p.drugLoading === undefined) p.drugLoading = 5.0;
    if (!p.stage) p.stage = 1;

    // 기본 시뮬레이션 결과 캐시가 없으면 계산
    if (!p.simulationResults) {
      const props = PhysicsEngine.calculateCompositeProperties(p.materials, p.crosslinker, p.crosslinkerDensity, { ph: p.phCondition, temp: p.tempCondition });
      const sim = PhysicsEngine.simulateDrugRelease(p.materials, p.crosslinker, p.crosslinkerDensity, { ph: p.phCondition, drugLoading: p.drugLoading });
      p.simulationResults = { props, sim };
    }

    // 기본 상호작용 분석
    if (!p.interactionAnalysis && p.materials.length >= 2) {
      p.interactionAnalysis = PhysicsEngine.analyzeMaterialInteraction(p.materials[0].id, p.materials[1].id, { ph: p.phCondition, temp: p.tempCondition });
    }

    // 기본 후속 실험 계획
    if (!p.experimentProtocol) {
      p.experimentProtocol = PhysicsEngine.generateDynamicExperimentProtocol(p);
    }
  },

  saveProjectsToStorage() {
    try {
      localStorage.setItem("bioform_projects", JSON.stringify(this.projects));
      localStorage.setItem("bioform_active_project_id", this.activeProjectId);
    } catch (e) {
      console.warn("저장 실패", e);
    }
  },

  getActiveProject() {
    let proj = this.projects.find(p => p.id === this.activeProjectId);
    if (!proj) {
      proj = this.projects[0];
      this.activeProjectId = proj.id;
    }
    this.ensureProjectPipelineData(proj);
    return proj;
  },

  setActiveProject(projId) {
    if (!this.projects.some(p => p.id === projId)) return;
    this.activeProjectId = projId;
    this.saveProjectsToStorage();
    const proj = this.getActiveProject();
    this.showToast(`활성 프로젝트가 '${proj.name}'(으)로 변경되었습니다.`);
    this.renderActiveTab();
    this.updateGlobalHeader();
  },

  // --------------------------------------------------------------------------
  // 2. 내비게이션 및 모달 바인딩
  // --------------------------------------------------------------------------
  bindNavigation() {
    document.querySelectorAll(".nav-tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        this.switchTab(tab);
      });
    });

  switchTab(tabId) {
    this.activeTab = tabId;
    document.querySelectorAll(".nav-tab-btn").forEach(btn => {
      if (btn.dataset.tab === tabId) {
        btn.classList.add("bg-sky-500/20", "text-sky-400", "border-sky-500/40");
        btn.classList.remove("text-slate-400", "hover:text-slate-200");
      } else {
        btn.classList.remove("bg-sky-500/20", "text-sky-400", "border-sky-500/40");
        btn.classList.add("text-slate-400", "hover:text-slate-200");
      }
    });

    document.querySelectorAll(".tab-pane").forEach(pane => pane.classList.add("hidden"));
    
    const targetPane = document.getElementById(`tab-${tabId}`);
    if (targetPane) {
      targetPane.classList.remove("hidden");
      this.renderTabContent(tabId);
    }
    this.updateGlobalHeader();
    window.scrollTo({ top: 0, behavior: "smooth" });
  },

  bindModalEvents() {
    const modal = document.getElementById("modal-new-project");
    const openBtn = document.getElementById("btn-open-create-modal");
    const closeBtn = document.getElementById("btn-close-create-modal");
    const form = document.getElementById("form-create-project");

    if (openBtn && modal) {
      openBtn.addEventListener("click", () => modal.classList.remove("hidden"));
    }
    if (closeBtn && modal) {
      closeBtn.addEventListener("click", () => modal.classList.add("hidden"));
    }
    if (form) {
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        this.handleCreateProject(form);
        modal.classList.add("hidden");
      });
    }
  },

  handleCreateProject(form) {
    const name = form.projectName.value.trim() || "새 생체재료 설계 프로젝트";
    const purpose = form.projectPurpose.value.trim() || "약물 전달 및 조직공학용 복합재료 개발";
    const targetDrug = form.targetDrug.value.trim() || "모델 약물 (BSA/소염제)";
    const description = form.projectDescription.value.trim() || "AI 기반 복합 생체재료 물성 최적화 연구.";
    
    // 선택된 재료 체크박스 추출
    const selectedMats = [];
    form.querySelectorAll("input[name='materials']:checked").forEach(cb => selectedMats.push(cb.value));
    
    const baseMats = selectedMats.length > 0 ? selectedMats : ["alginate", "chitosan"];
    const ratioPerMat = Math.floor(100 / baseMats.length);
    const materials = baseMats.map((id, idx) => ({
      id,
      ratio: idx === baseMats.length - 1 ? 100 - (ratioPerMat * (baseMats.length - 1)) : ratioPerMat
    }));

    const newProject = {
      id: `proj_${Date.now()}`,
      name,
      purpose,
      targetDrug,
      drugLoading: 5.0,
      materials,
      crosslinker: "ca",
      crosslinkerDensity: 2.0,
      phCondition: 7.4,
      tempCondition: 37.0,
      status: "in_progress",
      stage: 1,
      createdAt: new Date().toISOString().split("T")[0],
      updatedAt: new Date().toISOString().split("T")[0],
      description
    };

    this.ensureProjectPipelineData(newProject);
    this.projects.unshift(newProject);
    this.activeProjectId = newProject.id;
    this.saveProjectsToStorage();
    form.reset();

    this.showToast(`새 프로젝트 '${name}'이(가) 등록되고 활성화되었습니다.`);
    this.renderActiveTab();
    this.updateGlobalHeader();
  },

  updateGlobalHeader() {
    const proj = this.getActiveProject();
    const nameEl = document.getElementById("header-active-proj-name");
    const drugEl = document.getElementById("header-active-drug");
    if (nameEl) nameEl.textContent = proj.name;
    if (drugEl) drugEl.textContent = `대상 약물: ${proj.targetDrug}`;
  },

  renderActiveTab() {
    this.renderTabContent(this.activeTab);
  },

    switch (tabId) {
      case "dashboard": this.renderDashboard(); break;
      case "biomaterial_database": this.renderBiomaterialDatabase(); break;
      case "material_interaction": this.renderMaterialInteraction(); break;
      case "formulation_designer": this.renderFormulationDesigner(); break;
      case "property_simulation": this.renderPropertySimulation(); break;
      case "inverse_design": this.renderInverseDesign(); break;
      case "multi_objective_opt": this.renderMultiObjectiveOpt(); break;
      case "explainable_ai": this.renderExplainableAI(); break;
      case "experimental_design": this.renderExperimentalDesign(); break;
      case "research_report": this.renderResearchReport(); break;

  addMaterialToActiveProject(matId) {
    const proj = this.getActiveProject();
    if (proj.materials.some(m => m.id === matId)) {
      this.showToast("이미 현재 프로젝트 조성에 포함되어 있습니다.");
      this.switchTab("formulation_designer");
      return;
    }

    proj.materials.push({ id: matId, ratio: 10 });
    this.normalizeProjectComposition(proj);
    proj.stage = Math.max(proj.stage, 4);
    this.saveProjectsToStorage();
    this.showToast(`재료가 프로젝트 '${proj.name}'에 추가되었습니다.`);
    this.switchTab("formulation_designer");
  },

  normalizeProjectComposition(proj) {
    const sum = proj.materials.reduce((acc, m) => acc + m.ratio, 0);
    if (sum === 0) {
      proj.materials[0].ratio = 100;
    } else {
      let accum = 0;
      proj.materials.forEach((m, idx) => {
        if (idx === proj.materials.length - 1) {
          m.ratio = 100 - accum;
        } else {
          m.ratio = Math.round((m.ratio / sum) * 100);
          accum += m.ratio;
        }
      });
    }
  },

    const existsB = proj.materials.some(m => m.id === matB);

    if (!existsA || !existsB) {
      proj.materials = [

  handleSliderRatioInput(index, val) {
    const proj = this.getActiveProject();
    const num = Math.max(0, Math.min(100, parseInt(val) || 0));
    proj.materials[index].ratio = num;
    
    // 숫자 입력창 즉시 동기화
    const numEl = document.getElementById(`num-mat-${index}`);
    if (numEl) numEl.value = num;

    // 합계 검증 배지 갱신
    const totalRatio = proj.materials.reduce((sum, m) => sum + m.ratio, 0);
    const labelTotal = document.getElementById("label-formulation-total");
    const badgeStatus = document.getElementById("badge-formulation-status");
    if (labelTotal) labelTotal.textContent = `합계: ${totalRatio}%`;
    if (badgeStatus) badgeStatus.textContent = totalRatio === 100 ? "✓ (100% 정상)" : "⚠ (합계 불일치)";

    // 차트 즉시 갱신
    this.initFormulationDonutChart();
    this.saveProjectsToStorage();

  updateFormulationRatio(index, val) {
    const proj = this.getActiveProject();
    proj.materials[index].ratio = Math.max(0, Math.min(100, parseInt(val) || 0));
    this.saveProjectsToStorage();
    this.renderFormulationDesigner();

  removeFormulationMaterial(index) {
    const proj = this.getActiveProject();
    if (proj.materials.length <= 1) return;
    proj.materials.splice(index, 1);
    this.normalizeProjectComposition(proj);
    this.saveProjectsToStorage();
    this.renderFormulationDesigner();

    const sel = document.getElementById("select-add-db-mat");

    const proj = this.getActiveProject();

    this.showToast("조성비가 100%로 균등 정규화되었습니다.");

  executeFormulationToSimulation() {
    const proj = this.getActiveProject();
    const totalRatio = proj.materials.reduce((sum, m) => sum + m.ratio, 0);
    if (totalRatio !== 100) {
      this.autoNormalizeActiveProject();
    }

    // 시뮬레이션 계산 실행 및 결과 영구 보존
    const props = PhysicsEngine.calculateCompositeProperties(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition, temp: proj.tempCondition });
    const sim = PhysicsEngine.simulateDrugRelease(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition, drugLoading: proj.drugLoading });
    proj.simulationResults = { props, sim };
    proj.stage = Math.max(proj.stage, 5);
    proj.updatedAt = new Date().toISOString().split("T")[0];
    this.saveProjectsToStorage();

    this.showToast("조성이 시뮬레이션 엔진으로 전달되어 물성 및 방출 계산이 완료되었습니다.");
    this.switchTab("property_simulation");
  },

  initFormulationDonutChart() {
    const ctx = document.getElementById("chart-formulation-donut");
    if (!ctx) return;

    const proj = this.getActiveProject();
    if (this.charts.donut) {
      this.charts.donut.destroy();
    }

    const labels = proj.materials.map(m => {
      const dbMat = BIOMATERIALS_DB.find(x => x.id === m.id);
      return dbMat ? dbMat.nameKo : m.id;
    });

    const data = proj.materials.map(m => m.ratio);
    const colors = proj.materials.map(m => {
      const dbMat = BIOMATERIALS_DB.find(x => x.id === m.id);
      return dbMat ? dbMat.color : "#38BDF8";
    });

    this.charts.donut = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels,
        datasets: [{
          data,
          backgroundColor: colors,
          borderColor: "#0F172A",
          borderWidth: 3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: "bottom",
            labels: { color: "#E2E8F0", font: { size: 11 } }
          }
        },
        cutout: "65%"
      }
    });
  },

  handleSimParamChange(type, val) {
    const proj = this.getActiveProject();
    if (type === "ph") {
      proj.phCondition = parseFloat(val);
      const disp = document.getElementById("sim-disp-ph");
      if (disp) disp.textContent = proj.phCondition;
    } else if (type === "drug") {
      proj.drugLoading = parseFloat(val);
      const disp = document.getElementById("sim-disp-drug");
      if (disp) disp.textContent = `${proj.drugLoading} wt%`;
    } else if (type === "density") {
      proj.crosslinkerDensity = parseFloat(val);
      const disp = document.getElementById("sim-disp-density");
      if (disp) disp.textContent = `${proj.crosslinkerDensity} wt%`;
    }
    this.recalculateAndSaveSimulation(false);
  },

  recalculateAndSaveSimulation(showToast = true) {
    const proj = this.getActiveProject();
    const props = PhysicsEngine.calculateCompositeProperties(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition, temp: proj.tempCondition });
    const sim = PhysicsEngine.simulateDrugRelease(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition, drugLoading: proj.drugLoading });
    proj.simulationResults = { props, sim };
    proj.stage = Math.max(proj.stage, 5);
    proj.updatedAt = new Date().toISOString().split("T")[0];
    this.saveProjectsToStorage();

    if (showToast) {
      this.showToast("시뮬레이션이 최신 파라미터로 계산되어 프로젝트에 저장되었습니다.");
    }
    this.renderPropertySimulation();
  },

  passSimulationToInverseDesign() {
    const proj = this.getActiveProject();
    const props = proj.simulationResults.props;
    const sim = proj.simulationResults.sim;
    
    proj.inverseTargets = {
      targetModulus: Math.round(props.elasticModulusKPa),
      targetSwelling: Math.round(props.swellingRatioPercent),
      targetRelease: Math.round(sim.release24h),
      targetBiodegradation: Math.round(props.biodegradationDays)
    };
    proj.stage = Math.max(proj.stage, 6);
    this.saveProjectsToStorage();
    this.showToast("시뮬레이션 결과가 역설계 목표값으로 전달되었습니다.");
    this.switchTab("inverse_design");
  },

  executeInverseDesignSearch(showToast = true) {
    const targetModulus = parseInt(document.getElementById("input-inv-modulus")?.value) || 30;
    const targetSwelling = parseInt(document.getElementById("input-inv-swelling")?.value) || 1200;
    const targetRelease = parseInt(document.getElementById("input-inv-release")?.value) || 85;
    const targetBiodegradation = parseInt(document.getElementById("input-inv-biodeg")?.value) || 28;

    const targets = { targetModulus, targetSwelling, targetRelease, targetBiodegradation };
    const candidates = PhysicsEngine.runInverseDesign(targets);

    // 프로젝트 상태에 역설계 목표 및 결과 저장
    const proj = this.getActiveProject();
    proj.inverseTargets = targets;
    proj.inverseResults = candidates;
    proj.stage = Math.max(proj.stage, 6);
    this.saveProjectsToStorage();

    if (showToast) {
      this.showToast("목표 물성에 부합하는 5개 최적 조성 후보가 역설계되었습니다.");
    }

    const container = document.getElementById("inverse-candidates-container");
    if (!container) return;

    container.innerHTML = candidates.map((c, idx) => {
      const compStr = c.composition.map(comp => {
        const dbMat = BIOMATERIALS_DB.find(x => x.id === comp.id);
        return `<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-200 border border-slate-700 text-[11px]">${dbMat ? dbMat.nameKo : comp.id} <strong>${comp.ratio}%</strong></span>`;
      }).join(" ");

      return `
        <div class="p-5 rounded-2xl bg-slate-900 border ${idx === 0 ? 'border-sky-500/50 shadow-lg shadow-sky-500/10' : 'border-slate-800'} transition-all">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full ${idx === 0 ? 'bg-sky-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-300'} text-xs flex items-center justify-center font-bold">
                #${idx + 1}
              </span>
              <h4 class="font-bold text-white text-sm">${c.name}</h4>
              ${idx === 0 ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30">최우수 일치도</span>' : ''}
            </div>
            <div class="text-right">
              <span class="text-[11px] text-slate-400">목표 적합도:</span>
              <span class="text-base font-black text-sky-400 font-mono ml-1">${c.matchScore}%</span>
            </div>
          </div>

          <div class="flex flex-wrap gap-1.5 mb-3">
            ${compStr}
            <span class="px-2 py-0.5 rounded bg-slate-800 text-amber-300 border border-slate-700 text-[11px]">가교제: ${c.crosslinker} (${c.crosslinkerDensity} wt%)</span>
          </div>

          <!-- 목표값과 예측값의 차이(Delta) 테이블 -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs border-t border-slate-800 pt-3">
            <div class="p-2 rounded-lg bg-slate-800/40">
              <span class="text-slate-500 text-[10px] block">탄성계수 (목표: ${targetModulus})</span>
              <div class="font-bold text-white">${c.predictedProps.elasticModulusKPa} kPa <span class="text-[10px] ${c.differences.modulus >= 0 ? 'text-sky-400' : 'text-amber-400'} font-mono">(${c.differences.modulus >= 0 ? '+' : ''}${c.differences.modulus})</span></div>
            </div>
            <div class="p-2 rounded-lg bg-slate-800/40">
              <span class="text-slate-500 text-[10px] block">팽윤율 (목표: ${targetSwelling}%)</span>
              <div class="font-bold text-white">${c.predictedProps.swellingRatioPercent}% <span class="text-[10px] ${c.differences.swelling >= 0 ? 'text-sky-400' : 'text-amber-400'} font-mono">(${c.differences.swelling >= 0 ? '+' : ''}${c.differences.swelling})</span></div>
            </div>
            <div class="p-2 rounded-lg bg-slate-800/40">
              <span class="text-slate-500 text-[10px] block">방출률 (목표: ${targetRelease}%)</span>
              <div class="font-bold text-emerald-400">${c.predictedRelease}% <span class="text-[10px] ${c.differences.release >= 0 ? 'text-emerald-400' : 'text-amber-400'} font-mono">(${c.differences.release >= 0 ? '+' : ''}${c.differences.release})</span></div>
            </div>
            <div class="p-2 rounded-lg bg-slate-800/40">
              <span class="text-slate-500 text-[10px] block">분해시간 (목표: ${targetBiodegradation}일)</span>
              <div class="font-bold text-indigo-400">${c.predictedProps.biodegradationDays}일 <span class="text-[10px] font-mono">(${c.differences.biodegradation >= 0 ? '+' : ''}${c.differences.biodegradation})</span></div>
            </div>
          </div>

          <div class="mt-3 pt-3 border-t border-slate-800/60 flex justify-end">
            <button onclick='UI.applyCandidateToActiveProject(${JSON.stringify(c)})'
                    class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold text-xs border border-slate-700 transition-all">
              이 후보 조성을 현재 프로젝트에 적용 &rarr;
            </button>
          </div>
        </div>
      `;
    }).join("");
  },

  applyCandidateToActiveProject(candidate) {
    const proj = this.getActiveProject();
    proj.materials = JSON.parse(JSON.stringify(candidate.composition));
    proj.crosslinker = candidate.crosslinker;
    proj.crosslinkerDensity = candidate.crosslinkerDensity;
    proj.selectedInverseCandidate = candidate;
    
    // 시뮬레이션 결과 자동 갱신
    const props = PhysicsEngine.calculateCompositeProperties(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition, temp: proj.tempCondition });
    const sim = PhysicsEngine.simulateDrugRelease(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition, drugLoading: proj.drugLoading });
    proj.simulationResults = { props, sim };
    proj.stage = Math.max(proj.stage, 6);
    this.saveProjectsToStorage();

    this.showToast(`후보 '${candidate.name}'이(가) 프로젝트에 정식 반영되었습니다.`);
    this.switchTab("formulation_designer");
  },

  runMultiObjOpt() {
    const wDur = parseInt(document.getElementById("weight-dur")?.value) || 25;
    const wBio = parseInt(document.getElementById("weight-bio")?.value) || 25;
    const wStr = parseInt(document.getElementById("weight-str")?.value) || 20;
    const wDeg = parseInt(document.getElementById("weight-deg")?.value) || 15;
    const wCost = parseInt(document.getElementById("weight-cost")?.value) || 15;

    const weights = { duration: wDur, biocompatibility: wBio, strength: wStr, biodegradation: wDeg, cost: wCost };
    const results = PhysicsEngine.runMultiObjectiveOptimization(weights);

    // 프로젝트 상태에 가중치 및 순위 결과 저장
    const proj = this.getActiveProject();
    proj.optimizationWeights = weights;
    proj.optimizationResults = results;
    proj.stage = Math.max(proj.stage, 7);
    this.saveProjectsToStorage();

    // 순위표 갱신
    const tbody = document.getElementById("opt-ranking-tbody");
    if (tbody) {
      tbody.innerHTML = results.map((c, idx) => {
        const isTop3 = idx < 3;
        const compStr = c.composition.map(comp => {
          const m = BIOMATERIALS_DB.find(x => x.id === comp.id);
          return `${m ? m.nameKo : comp.id}(${comp.ratio}%)`;
        }).join(", ");

        return `
          <tr class="${isTop3 ? 'bg-sky-500/10' : 'hover:bg-slate-800/40'}">
            <td class="p-3 font-bold font-mono">
              <span class="px-2 py-0.5 rounded ${idx === 0 ? 'bg-sky-500 text-slate-950 font-black' : isTop3 ? 'bg-slate-800 text-sky-400 border border-sky-500/30' : 'text-slate-400'}">
                #${idx + 1}
              </span>
            </td>
            <td class="p-3 font-semibold text-white">${c.name}</td>
            <td class="p-3 text-slate-300 font-mono text-[11px]">${compStr}</td>
            <td class="p-3 text-slate-300 font-mono">${c.sustainedHours}h</td>
            <td class="p-3 text-emerald-400 font-mono">${c.subScores.biocompatibility}</td>
            <td class="p-3 text-blue-400 font-mono">${c.predictedProps.elasticModulusKPa} kPa</td>
            <td class="p-3 font-black text-sky-400 font-mono text-sm">${c.overallScore}</td>
            <td class="p-3 text-right">
              <button onclick='UI.selectOptimalCandidate(${JSON.stringify(c)})'
                      class="px-2.5 py-1 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 text-xs font-bold shadow-md transition-all">
                최종 채택
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    // 레이더 차트 갱신
    const ctxRadar = document.getElementById("chart-opt-radar");
    if (ctxRadar) {
      if (this.charts.optRadar) this.charts.optRadar.destroy();
      const top1 = results[0];
      const top2 = results[1];

      this.charts.optRadar = new Chart(ctxRadar, {
        type: "radar",
        data: {
          labels: ["방출 지속성", "생체적합성", "기계적 강도", "생분해 적정성", "비용 경쟁력"],
          datasets: [
            {
              label: `#1 ${top1.name.split(' ')[0]}`,
              data: [top1.subScores.duration, top1.subScores.biocompatibility, top1.subScores.strength, top1.subScores.biodegradation, top1.subScores.cost],
              borderColor: "#38BDF8",
              backgroundColor: "rgba(56, 189, 248, 0.25)",
              borderWidth: 2
            },
            {
              label: `#2 ${top2.name.split(' ')[0]}`,
              data: [top2.subScores.duration, top2.subScores.biocompatibility, top2.subScores.strength, top2.subScores.biodegradation, top2.subScores.cost],
              borderColor: "#818CF8",
              backgroundColor: "rgba(129, 140, 248, 0.2)",
              borderWidth: 2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#E2E8F0" } } },
          scales: {
            r: {
              min: 0,
              max: 100,
              ticks: { display: false },
              grid: { color: "#1E293B" },
              pointLabels: { color: "#94A3B8", font: { size: 10, weight: "bold" } }
            }
          }
        }
      });
    }

    // 산점도 갱신
    const ctxScatter = document.getElementById("chart-opt-scatter");

    const proj = this.getActiveProject();
    proj.materials = JSON.parse(JSON.stringify(candidate.composition));
    proj.crosslinker = candidate.crosslinker;
    proj.crosslinkerDensity = candidate.crosslinkerDensity;
    proj.optimalCandidate = candidate;
    
    // 시뮬레이션 및 상호작용 자동 동기화
    const props = PhysicsEngine.calculateCompositeProperties(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition, temp: proj.tempCondition });
    const sim = PhysicsEngine.simulateDrugRelease(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition, drugLoading: proj.drugLoading });

    proj.stage = Math.max(proj.stage, 7);

            <div class="p-3 rounded-xl bg-slate-800/60 border border-slate-800">
              <span class="text-slate-400 text-[10px] block">탄성계수 (E)</span>
              <span class="text-lg font-bold text-white font-mono">${props.elasticModulusKPa} kPa</span>
            </div>
            <div class="p-3 rounded-xl bg-slate-800/60 border border-slate-800">
              <span class="text-slate-400 text-[10px] block">평형 팽윤율 (Q)</span>
              <span class="text-lg font-bold text-sky-400 font-mono">${props.swellingRatioPercent}%</span>
            </div>
            <div class="p-3 rounded-xl bg-slate-800/60 border border-slate-800">
              <span class="text-slate-400 text-[10px] block">24h 누적 방출률</span>
              <span class="text-lg font-bold text-emerald-400 font-mono">${sim.release24h}%</span>
            </div>
            <div class="p-3 rounded-xl bg-slate-800/60 border border-slate-800">
              <span class="text-slate-400 text-[10px] block">생체적합성 점수</span>
              <span class="text-lg font-bold text-indigo-400 font-mono">${props.biocompatibilityScore} / 100</span>
            </div>
          </div>

          <!-- 실제 차트 캔버스 렌더링 -->
          <div class="p-4 rounded-xl bg-slate-800/40 border border-slate-800">
            <div class="text-xs font-semibold text-slate-300 mb-2">약물 방출 키네틱 곡선 (Korsmeyer-Peppas n = ${sim.nExponent})</div>
            <div class="w-full h-56 relative">
              <canvas id="chart-report-release-canvas"></canvas>
            </div>
          </div>
        </div>

        <!-- 5. 역설계 및 최적 후보 순위 결과 -->
        <div>
          <h3 class="text-sm font-bold text-sky-400 uppercase tracking-wider mb-2">5. 목표 역설계 및 최적화 채택 결과</h3>
          <div class="p-4 rounded-xl bg-slate-800/40 border border-slate-800 text-xs space-y-2">
            ${optCand ? `
              <div class="flex justify-between items-center text-slate-200">
                <span class="font-bold text-sky-300">최종 채택 최적 후보: ${optCand.name}</span>
                <span class="font-mono font-bold text-emerald-400">종합 만족도: ${optCand.overallScore}점</span>
              </div>
            ` : invCand ? `
              <div class="flex justify-between items-center text-slate-200">
                <span class="font-bold text-sky-300">역설계 채택 후보: ${invCand.name}</span>
                <span class="font-mono font-bold text-sky-400">목표 일치도: ${invCand.matchScore}%</span>
              </div>
            ` : `
              <div class="text-slate-300">현재 조성 설계안이 기본 최적화 기준을 충족하고 있습니다.</div>
            `}
            <p class="text-slate-400 text-[11px] leading-relaxed">
              Korsmeyer-Peppas 비픽 확산 지배 메커니즘을 통해 초기 버스트 방출을 통제하고, 80% 이상의 약물 방출이 지속되는 최적의 가교 밀도를 확보하였습니다.
            </p>
          </div>
        </div>

        <!-- 6. AI 분석 근거 및 후속 검증 계획 -->
        <div>
          <h3 class="text-sm font-bold text-sky-400 uppercase tracking-wider mb-2">6. AI 분석 근거 및 후속 검증 계획</h3>
          <p class="text-xs text-slate-300 leading-relaxed mb-3">${xai.recommendationReason}</p>
          
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs border border-slate-800 rounded-xl overflow-hidden">
              <thead class="bg-slate-800 text-slate-400 uppercase text-[10px]">
                <tr>
                  <th class="p-2.5">실험군</th>
                  <th class="p-2.5">배합 조성</th>
                  <th class="p-2.5">가교 조건</th>
                  <th class="p-2.5">검증 프로토콜</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800 text-slate-300 text-[11px]">
                ${protocol.runs.slice(0, 4).map(r => `
                  <tr>
                    <td class="p-2.5 font-bold text-sky-400">${r.id}</td>
                    <td class="p-2.5">${r.compositionDesc}</td>
                    <td class="p-2.5 font-mono text-amber-300">${r.crosslinkerDesc}</td>
                    <td class="p-2.5 text-slate-400">${r.expectedOutcome}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    setTimeout(() => {
      this.initReportReleaseChart(sim);
    }, 50);
  },

  initReportReleaseChart(sim) {
    const ctx = document.getElementById("chart-report-release-canvas");
    if (!ctx) return;

    if (this.charts.reportRelease) {
      this.charts.reportRelease.destroy();
    }

    this.charts.reportRelease = new Chart(ctx, {
      type: "line",
      data: {
        labels: sim.timePoints.map(t => `${t}h`),
        datasets: [{
          label: "누적 약물 방출률 (%)",
          data: sim.cumulativeRelease,
          borderColor: "#38BDF8",
          backgroundColor: "rgba(56, 189, 248, 0.2)",
          borderWidth: 2.5,
          fill: true,
          tension: 0.35,
          pointRadius: 3,
          pointBackgroundColor: "#38BDF8"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          x: {
            grid: { color: "#1E293B" },
            ticks: { color: "#94A3B8", font: { size: 10 } }
          },
          y: {
            min: 0,
            max: 100,
            grid: { color: "#1E293B" },
            ticks: {
              color: "#94A3B8",
              font: { size: 10 },
              callback: (v) => `${v}%`
            }
          }
        }
      }
    });
  },

  downloadReportMarkdown() {
    const proj = this.getActiveProject();
    const props = proj.simulationResults?.props || PhysicsEngine.calculateCompositeProperties(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition });
    const sim = proj.simulationResults?.sim || PhysicsEngine.simulateDrugRelease(proj.materials, proj.crosslinker, proj.crosslinkerDensity, { ph: proj.phCondition, drugLoading: proj.drugLoading });
    const inter = proj.interactionAnalysis || PhysicsEngine.analyzeMaterialInteraction(proj.materials[0]?.id || "alginate", proj.materials[1]?.id || "chitosan");
    const protocol = proj.experimentProtocol || PhysicsEngine.generateDynamicExperimentProtocol(proj);

    const compStr = proj.materials.map(m => {
      const dbMat = BIOMATERIALS_DB.find(x => x.id === m.id);
      return `- **${dbMat ? dbMat.nameKo : m.id}**: ${m.ratio} wt%`;
    }).join("\n");

    const runsStr = protocol.runs.map(r => `- **${r.id} (${r.label})**: ${r.compositionDesc} | ${r.crosslinkerDesc} (${r.expectedOutcome})`).join("\n");

    const content = `# [BIOFORM AI] 종합 연구 보고서
**과제명**: ${proj.name}
**연구 목적**: ${proj.purpose}
**대상 약물**: ${proj.targetDrug} (${proj.drugLoading} wt%)
**발행일자**: ${new Date().toISOString().split("T")[0]}
**진행 상태**: ${proj.status === 'completed' ? '연구 완료 (Completed)' : '진행중 (In-Progress)'}

---

## 1. 복합 생체재료 배합 조성
${compStr}
- **가교제**: ${proj.crosslinker} (${proj.crosslinkerDensity} wt%)
- **환경 조건**: pH ${proj.phCondition}, ${proj.tempCondition}℃

## 2. 재료 간 상호작용 분석 결과
- **분자 상용성 지수**: ${inter.compatibilityScore} / 100
- **상호작용 평가**: ${inter.summaryText}

## 3. 인실리코 물성 및 방출 예측 결과
- **탄성계수(E)**: ${props.elasticModulusKPa} kPa
- **인장강도(UTS)**: ${props.tensileStrengthMPa} MPa
- **평형 팽윤율(Q)**: ${props.swellingRatioPercent}%
- **24시간 누적 약물 방출률**: ${sim.release24h}%
- **초기 1시간 방출 속도**: ${sim.initialBurstRate}% / h
- **약물 방출 지속시간(t80)**: ${sim.sustainedDurationHours}시간
- **생체적합성 지표**: ${props.biocompatibilityScore} / 100
- **생분해 지속기간**: 약 ${props.biodegradationDays}일

## 4. 후속 실험 설계 (Experimental Protocol)
**연구 주제**: ${protocol.topic}
**실험 가설**: ${protocol.hypothesis}

### 실험군 구성:
${runsStr}

### 분석 장비 및 SOP:
1. FT-IR 분광분석기 (특이 피크 이동 및 PEC 결합 형성 확인)
2. 회전형 레오미터 (저장 탄성률 G' > 손실 탄성률 G'' 겔화 판정)
3. USP II 패들 용출 시험 (시간별 누적 방출 속도 실측)
`;

    const blob = new Blob([content], { type: "text/markdown;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `BIOFORM_Dossier_${proj.id}.md`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    this.showToast("종합 연구 보고서 Markdown 파일이 다운로드되었습니다.");
  },

  showToast(msg) {
    const toast = document.getElementById("ui-toast");
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.remove("opacity-0", "translate-y-4");
    toast.classList.add("opacity-100", "translate-y-0");
    setTimeout(() => {
      toast.classList.remove("opacity-100", "translate-y-0");
      toast.classList.add("opacity-0", "translate-y-4");
    }, 3200);
  }
};

if (typeof window !== "undefined") {
  window.UI = UI;
}

  </script>

  <script>
  /* === app.js === */
/**
 * BIOFORM AI - Application Bootstrap & Global Hotkeys
 */

document.addEventListener("DOMContentLoaded", () => {
  console.log("BIOFORM AI - Initializing Biomaterial Research Suite v2.5...");

  if (window.UI) {
    window.UI.init();
  }

  // 숫자 단축키 [1~0] 탭 즉시 전환
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") {
      return;
    }

    const tabMap = {
      "1": "dashboard",
      "2": "biomaterial_database",
      "3": "material_interaction",
      "4": "formulation_designer",
      "5": "property_simulation",
      "6": "inverse_design",
      "7": "multi_objective_opt",
      "8": "explainable_ai",
      "9": "experimental_design",
      "0": "research_report"
    };

    if (tabMap[e.key]) {
      UI.switchTab(tabMap[e.key]);
    }

    // Escape 키로 열려있는 모달 닫기
    if (e.key === "Escape") {
      document.getElementById("modal-new-project")?.classList.add("hidden");
      document.getElementById("modal-mat-detail")?.classList.add("hidden");
    }
  });

  console.log("BIOFORM AI - Platform ready. Scientific pipeline connected.");
});

  </script>
